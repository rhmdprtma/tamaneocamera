<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TAMA NEO CAMERA</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;overflow:hidden}
#wrap{position:fixed;inset:0;background:#000}
video#cam{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);opacity:0;pointer-events:none}
canvas#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#top{position:absolute;top:10px;left:10px;right:10px;z-index:20;pointer-events:none}
#brand{background:rgba(10,18,35,.85);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:8px 14px;display:inline-flex;align-items:center;gap:8px;font-weight:900;letter-spacing:4px;font-size:13px}
#brand i{width:8px;height:8px;background:#22c55e;border-radius:50%;box-shadow:0 0 10px #22c55e;display:block}
#stat{margin-top:6px;display:inline-block;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.15);padding:5px 10px;border-radius:999px;font-size:11px}
#panel{position:absolute;left:10px;right:10px;bottom:118px;z-index:30}
#hint{background:rgba(0,0,0,.65);border:1px solid rgba(255,255,255,.15);padding:9px 12px;border-radius:12px;text-align:center;font-size:12px}
#settings{background:rgba(10,18,35,.92);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.18);border-radius:18px;padding:14px;margin-top:8px;display:none}
#settings.open{display:block}
#settings h3{font-size:14px;margin-bottom:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
button{border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff;padding:9px 13px;border-radius:999px;font-size:12px;font-weight:700;cursor:pointer}
button.on{background:#fff;color:#000}
button.blue.on{background:#3b82f6;color:#fff}
button.violet.on{background:#a855f7;color:#fff}
button.fire.on{background:#f97316;color:#fff}
#actions{position:absolute;left:10px;right:10px;bottom:66px;display:flex;gap:8px;z-index:30}
#actions button{flex:1;padding:12px;font-size:13px;font-weight:900;border-radius:14px}
#actions button.on{background:#fff;color:#000}
#actions button.rec.on{background:#ef4444;color:#fff}
#dock{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.75);backdrop-filter:blur(12px);padding:8px 10px 14px;display:flex;gap:8px;overflow-x:auto;z-index:30;scrollbar-width:none}
#dock::-webkit-scrollbar{display:none}
.dockBtn{min-width:78px;padding:9px 10px;border-radius:14px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);text-align:center;flex-shrink:0}
.dockBtn b{font-size:12px;display:block}
.dockBtn span{font-size:10px;opacity:.7}
.dockBtn.on{background:#fff;color:#000}
.dockBtn.on span{opacity:.8}
#fileInput{display:none}
</style>
</head>
<body>
<div id="wrap">
<video id="cam" autoplay playsinline muted></video>
<canvas id="cv"></canvas>
<div id="top"><div id="brand"><i></i> TAMA NEO CAMERA</div><br><span id="stat">Memuat...</span></div>
<div id="panel">
<div id="hint">Semua efek aktif independen • pilih menu untuk pengaturan</div>
<div id="settings">
<h3 id="setTitle">🔥 API - TEGAK</h3>
<div class="row" id="setBody"></div>
<div class="row"><button onclick="closeSet()">✕ Tutup</button></div>
</div>
</div>
<div id="actions">
<button id="btnFull">⛶ FULL</button>
<button id="btnFoto">📸 FOTO</button>
<button id="btnVideo">🎥 VIDEO</button>
</div>
<div id="dock">
<div class="dockBtn" data-k="sensor"><b>👁️ SENSOR</b><span>Muka Blur</span></div>
<div class="dockBtn on" data-k="api"><b>🔥 API</b><span>Tegak - Telapak</span></div>
<div class="dockBtn" data-k="tornado"><b>🌪️ TORNADO</b><span>Datar - Atas</span></div>
<div class="dockBtn" data-k="hack"><b>💻 HACK</b><span>Topeng Pas Muka</span></div>
<div class="dockBtn" data-k="geng"><b>🐱 GENG</b><span>Bareng Kucing</span></div>
<div class="dockBtn" data-k="glow"><b>💸 GLOW</b><span>Duit + Emas</span></div>
</div>
</div>
<input type="file" id="fileInput" accept="image/*,video/*">
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
<script>
var video=document.getElementById('cam'), cv=document.getElementById('cv'), fctx=cv.getContext('2d');
var W=0,H=0, DPR=Math.min(2,window.devicePixelRatio||1);
var effectsOn={sensor:false,api:true,tornado:false,hack:false,geng:false,glow:false};
var activeMenu='api';
var face=null, lastFace=null, smoothFace=null, faceLostTime=0;
var handsArr=[];
var particles=[];
var topengImg=new Image(); topengImg.src='topeng.jpg';
var hackImg=new Image(); hackImg.src='hack.jpg';
var duitVid=document.createElement('video'); duitVid.src='duit.mp4'; duitVid.loop=true; duitVid.muted=true; duitVid.playsInline=true;
var gengVid=document.createElement('video'); gengVid.src='geng.mp4'; gengVid.loop=true; gengVid.muted=true; gengVid.playsInline=true;
var torVid=document.createElement('video'); torVid.src='tornado.mp4'; torVid.loop=true; torVid.muted=true; torVid.playsInline=true;
var apiVid=document.createElement('video'); apiVid.src='api.mp4'; apiVid.loop=true; apiVid.muted=true; apiVid.playsInline=true;
var glowMode='duit', apiSize='sedang', apiColor='fire';
var statEl=document.getElementById('stat');
var fps=0, lastFpsT=performance.now(), frames=0;

function resize(){ W=window.innerWidth; H=window.innerHeight; cv.width=W*DPR; cv.height=H*DPR; cv.style.width=W+'px'; cv.style.height=H+'px'; fctx.setTransform(DPR,0,0,DPR,0,0); }
window.addEventListener('resize',resize); resize();
function drawVideoCover(ctx,w,h){ if(!video.videoWidth) return; var vw=video.videoWidth, vh=video.videoHeight; var s=Math.max(w/vw,h/vh); var nw=vw*s, nh=vh*s; ctx.drawImage(video,(w-nw)/2,(h-nh)/2,nw,nh); }
function isPalmUp(lm){ return lm[9].y < lm[0].y - 0.04; }
function isFist(lm){ var d=0; for(var i=8;i<=20;i+=4) d+=Math.hypot(lm[i].x-lm[0].x,lm[i].y-lm[0].y); return d<0.45; }
function isIndexUp(lm){ return lm[8].y < lm[6].y && lm[12].y > lm[10].y; }
function handPos(lm){ return {x:(1-lm[9].x)*W, y:lm[9].y*H}; }

// ====== TOPENG - FIX: CROP BUANG BlckDoor + MASK LUNAK + PAKE SMOOTHFACE ======
function drawTopeng(){
  var cur = smoothFace || face || lastFace;
  if(!cur) return;
  if(!topengImg.complete || !topengImg.naturalWidth) return;
  var cx=cur.x, cy=cur.y - cur.h*0.02;
  var w=cur.w*1.02, h=cur.h*1.15;
  var iw=topengImg.naturalWidth, ih=topengImg.naturalHeight;
  var sx=iw*0.21, sy=ih*0.28, sw=iw*0.58, sh=ih*0.60;
  fctx.save();
  var tmp=document.createElement('canvas'); tmp.width=Math.max(2,w); tmp.height=Math.max(2,h);
  var tctx=tmp.getContext('2d');
  tctx.drawImage(topengImg, sx,sy,sw,sh, 0,0, w,h);
  tctx.globalCompositeOperation='destination-in';
  var m=document.createElement('canvas'); m.width=w; m.height=h;
  var mctx=m.getContext('2d');
  var g2=mctx.createRadialGradient(w/2,h/2, Math.min(w,h)*0.18, w/2,h/2, Math.max(w,h)*0.52);
  g2.addColorStop(0,'rgba(255,255,255,1)'); g2.addColorStop(0.72,'rgba(255,255,255,1)');
  g2.addColorStop(0.88,'rgba(255,255,255,.45)'); g2.addColorStop(1,'rgba(255,255,255,0)');
  mctx.fillStyle=g2; mctx.save(); mctx.translate(w/2,h/2); mctx.scale(1,h/w); mctx.translate(-w/2,-h/2);
  mctx.beginPath(); mctx.arc(w/2,h/2,w/2,0,Math.PI*2); mctx.fill(); mctx.restore();
  tctx.drawImage(m,0,0);
  fctx.drawImage(tmp, cx-w/2, cy-h/2, w,h);
  fctx.restore();
}

// ====== HACK BG ======
function drawHackBG(){
  if(hackImg.complete && hackImg.naturalWidth){
    var s=Math.max(W/hackImg.naturalWidth, H/hackImg.naturalHeight);
    var nw=hackImg.naturalWidth*s, nh=hackImg.naturalHeight*s;
    fctx.drawImage(hackImg,(W-nw)/2,(H-nh)/2,nw,nh);
  } else { fctx.fillStyle='#020718'; fctx.fillRect(0,0,W,H); }
  fctx.save(); fctx.globalAlpha=.55; drawVideoCover(fctx,W,H); fctx.restore();
  fctx.fillStyle='rgba(2,7,18,.45)'; fctx.fillRect(0,0,W,H);
  fctx.fillStyle='rgba(0,255,120,.06)'; fctx.fillRect(0,0,W,H);
}

// ====== API - FIX: CHROMA KEY + WARNA ASLI ======
var apiTmp=document.createElement('canvas'); apiTmp.width=200; apiTmp.height=200; var apiTctx=apiTmp.getContext('2d');
function drawRealFire(x,y,scale){
  if(apiVid.readyState<2) return;
  var t=performance.now()*0.001;
  var flick=1+Math.sin(t*9+x*0.05)*0.06+Math.random()*0.03;
  apiTctx.clearRect(0,0,200,200); apiTctx.drawImage(apiVid,0,0,200,200);
  var img=apiTctx.getImageData(0,0,200,200); var d=img.data;
  for(var i=0;i<d.length;i+=4){
    var r=d[i], g=d[i+1], b=d[i+2];
    if(g>90 && g>r*1.4 && g>b*1.4){ d[i+3]=0; continue; }
    if(g>70 && g>r*1.15 && g>b*1.15){ d[i+3]=d[i+3]*0.25; continue; }
    if(apiColor==='fire' && r>100 && g>80){
      d[i]=Math.min(255,r*1.15+30); d[i+1]=Math.min(255,g*0.92); d[i+2]=Math.min(255,b*0.55);
      if(r>200 && g>180){ d[i]=255; d[i+1]=240; d[i+2]=180; }
    }
    if(apiColor==='blue'){ d[i]=b*0.6; d[i+1]=g*0.8; d[i+2]=Math.min(255,r+80); }
    if(apiColor==='violet'){ d[i]=Math.min(255,r+60); d[i+1]=g*0.5; d[i+2]=Math.min(255,b+100); }
  }
  apiTctx.putImageData(img,0,0);
  var vw=190*scale*flick, vh=190*scale*flick;
  fctx.save(); fctx.globalCompositeOperation='lighter';
  var glow=fctx.createRadialGradient(x,y,5,x,y,110*scale);
  glow.addColorStop(0,'rgba(255,150,20,.55)'); glow.addColorStop(0.4,'rgba(255,90,0,.28)'); glow.addColorStop(1,'rgba(255,60,0,0)');
  fctx.fillStyle=glow; fctx.beginPath(); fctx.arc(x,y,110*scale,0,Math.PI*2); fctx.fill(); fctx.restore();
  fctx.save(); fctx.globalCompositeOperation='lighter';
  fctx.globalAlpha=.55; fctx.drawImage(apiTmp, x-vw*0.65, y-vh*0.65-10*scale, vw*1.3, vh*1.3);
  fctx.globalAlpha=.95; fctx.drawImage(apiTmp, x-vw/2, y-vh/2-10*scale, vw, vh);
  fctx.restore();
}

// ====== TORNADO - FIX: CHROMA KEY ======
var torTmp=document.createElement('canvas'); torTmp.width=200; torTmp.height=280; var torTctx=torTmp.getContext('2d');
function drawTornado(x,y,scale){
  if(torVid.readyState<2) return;
  torTctx.clearRect(0,0,200,280); torTctx.drawImage(torVid,0,0,200,280);
  var img=torTctx.getImageData(0,0,200,280); var d=img.data;
  for(var i=0;i<d.length;i+=4){
    var r=d[i], g=d[i+1], b=d[i+2];
    if(g>90 && g>r*1.4 && g>b*1.4) d[i+3]=0;
    else if(g>70 && g>r*1.15 && g>b*1.15) d[i+3]=d[i+3]*0.25;
  }
  torTctx.putImageData(img,0,0);
  var vw=200*scale, vh=280*scale;
  fctx.save(); fctx.drawImage(torTmp, x-vw/2, y-vh+20*scale, vw, vh); fctx.restore();
  fctx.save(); fctx.globalAlpha=.3; fctx.fillStyle='#000';
  fctx.beginPath(); fctx.ellipse(x,y+8,34*scale,8*scale,0,0,Math.PI*2); fctx.fill(); fctx.restore();
}

// ====== DUIT - FIX: CHROMA KEY + FULL LAYAR ======
var duitTmp=document.createElement('canvas'); duitTmp.width=320; duitTmp.height=180; var duitTctx=duitTmp.getContext('2d');
function drawDuitVideo(){
  if(duitVid.readyState<2) return;
  duitTctx.drawImage(duitVid,0,0,320,180);
  var img=duitTctx.getImageData(0,0,320,180); var d=img.data;
  for(var i=0;i<d.length;i+=4){
    var r=d[i], g=d[i+1], b=d[i+2];
    if(g>90 && g>r*1.4 && g>b*1.4) d[i+3]=0;
    else if(g>70 && g>r*1.15 && g>b*1.15) d[i+3]=d[i+3]*0.3;
  }
  duitTctx.putImageData(img,0,0);
  fctx.save(); fctx.translate(W,0); fctx.scale(-1,1); fctx.drawImage(duitTmp,0,0,W,H); fctx.restore();
}

// ====== GENG - FIX: LU DI BELAKANG, KUCING DI DEPAN ======
var gengTmp=document.createElement('canvas'); gengTmp.width=320; gengTmp.height=180; var gengTctx=gengTmp.getContext('2d');
function drawGeng(){
  var uw=W*0.46, uh=H*0.46;
  var ux=W/2-uw/2, uy=H*0.30-uh/2;
  fctx.save();
  fctx.beginPath(); fctx.ellipse(W/2, uy+uh/2, uw/2, uh/2, 0,0,Math.PI*2); fctx.clip();
  fctx.filter='brightness(0.82) contrast(1.08) saturate(0.85)';
  drawVideoCover(fctx,W,H); fctx.filter='none';
  fctx.fillStyle='rgba(10,18,35,.18)'; fctx.fillRect(ux,uy,uw,uh);
  fctx.restore();
  if(gengVid.readyState<2) return;
  gengTctx.drawImage(gengVid,0,0,320,180);
  var img=gengTctx.getImageData(0,0,320,180); var d=img.data;
  for(var i=0;i<d.length;i+=4){
    var r=d[i], g=d[i+1], b=d[i+2];
    if(g>90 && g>r*1.35 && g>b*1.35) d[i+3]=0;
    else if(g>70 && g>r*1.15 && g>b*1.15) d[i+3]=d[i+3]*0.25;
  }
  gengTctx.putImageData(img,0,0);
  fctx.save(); fctx.translate(W,0); fctx.scale(-1,1); fctx.drawImage(gengTmp,0,0,W,H); fctx.restore();
}

// ====== SENSOR - FIX: PAKE SMOOTHFACE, GAK KEBALIK, GAK GETER ======
function drawSensor(){
  var cur = smoothFace || face || lastFace;
  if(!cur) return;
  fctx.save();
  fctx.beginPath();
  fctx.ellipse(cur.x,cur.y,cur.w*0.58,cur.h*0.62,0,0,Math.PI*2);
  fctx.clip();
  fctx.filter='blur(18px) brightness(0.7)';
  drawVideoCover(fctx,W,H);
  fctx.filter='none';
  fctx.restore();
  fctx.save();
  fctx.strokeStyle='rgba(255,255,255,.25)'; fctx.lineWidth=1;
  fctx.beginPath(); fctx.ellipse(cur.x,cur.y,cur.w*0.58,cur.h*0.62,0,0,Math.PI*2); fctx.stroke();
  fctx.restore();
}

// ====== MAIN LOOP ======
function loop(){
  var now=performance.now(); frames++; if(now-lastFpsT>1000){ fps=frames; frames=0; lastFpsT=now; }
  fctx.clearRect(0,0,W,H);
  if(effectsOn.hack){ drawHackBG(); }
  else if(effectsOn.geng){ drawGeng(); }
  else { drawVideoCover(fctx,W,H); }
  if(effectsOn.sensor) drawSensor();
  if(effectsOn.hack) drawTopeng();
  handsArr.forEach(function(lm){
    var p=handPos(lm); var s = apiSize==='kecil'?0.7: apiSize==='besar'?1.35:1.0;
    if(effectsOn.api && !isFist(lm)){ drawRealFire(p.x, p.y-40, s); }
    if(effectsOn.tornado && isPalmUp(lm) && !isFist(lm)){ drawTornado(p.x, p.y-30, s); }
    if(effectsOn.glow && isIndexUp(lm)){
      if(particles.length<90) particles.push({x:p.x,y:p.y,vx:(Math.random()-0.5)*1.2,vy:-0.8-Math.random()*1.4,life:1,decay:0.015,size:3+Math.random()*5,color:'#facc15',spark:true});
    }
  });
  if(effectsOn.glow && glowMode==='duit') drawDuitVideo();
  particles=particles.filter(function(pt){ pt.x+=pt.vx; pt.y+=pt.vy; pt.life-=pt.decay; return pt.life>0; });
  particles.forEach(function(pt){ fctx.save(); fctx.globalAlpha=Math.max(0,pt.life); fctx.fillStyle=pt.color; fctx.beginPath(); fctx.arc(pt.x,pt.y,pt.size,0,Math.PI*2); fctx.fill(); fctx.restore(); });
  var onCount=Object.values(effectsOn).filter(Boolean).length;
  statEl.textContent=fps+' FPS | '+(onCount?Object.keys(effectsOn).filter(k=>effectsOn[k]).join(' • '):'Semua Off')+' | '+handsArr.length+' TANGAN';
  requestAnimationFrame(loop);
}
loop();

// ====== HANDS + FACE - FIX MIRROR + SMOOTHING ======
var hands=new Hands({locateFile:function(f){return 'https://cdn.jsdelivr.net/npm/@mediapipe/hands/'+f;}});
hands.setOptions({maxNumHands:2, modelComplexity:0, minDetectionConfidence:0.5, minTrackingConfidence:0.5});
hands.onResults(function(res){ handsArr=res.multiHandLandmarks||[]; });
var fm=new FaceMesh({locateFile:function(f){return 'https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/'+f;}});
fm.setOptions({maxNumFaces:1, refineLandmarks:true, minDetectionConfidence:0.5, minTrackingConfidence:0.5});
fm.onResults(function(res){
  if(res.multiFaceLandmarks && res.multiFaceLandmarks[0]){
    faceLostTime=0;
    var lm=res.multiFaceLandmarks[0]; var xs=lm.map(p=>p.x), ys=lm.map(p=>p.y);
    var minX=Math.min(...xs), maxX=Math.max(...xs), minY=Math.min(...ys), maxY=Math.max(...ys);
    // FIX: JANGAN PAKE 1-x LAGI - canvas kita gambarnya TIDAK di-mirror
    var rawX=((minX+maxX)/2)*W;
    var rawY=((minY+maxY)/2)*H;
    var rawW=(maxX-minX)*W*1.35;
    var rawH=(maxY-minY)*H*1.35;
    // FIX: SMOOTHING - biar gak geter, ngikutin muka halus
    if(!smoothFace){
      smoothFace={x:rawX,y:rawY,w:rawW,h:rawH};
    } else {
      smoothFace.x = smoothFace.x + (rawX - smoothFace.x)*0.35;
      smoothFace.y = smoothFace.y + (rawY - smoothFace.y)*0.35;
      smoothFace.w = smoothFace.w + (rawW - smoothFace.w)*0.25;
      smoothFace.h = smoothFace.h + (rawH - smoothFace.h)*0.25;
    }
    face=smoothFace; lastFace=smoothFace;
  } else {
    // FIX: Tahan 300ms biar gak kedip kalo muka ilang sesaat
    if(!faceLostTime) faceLostTime=performance.now();
    if(performance.now()-faceLostTime>300){ face=null; }
  }
});
var camUtil=new Camera(video,{onFrame:async function(){ await hands.send({image:video}); await fm.send({image:video}); }, width:640, height:480});
camUtil.start();
[duitVid,gengVid,torVid,apiVid].forEach(function(v){ v.play().catch(function(){}); });
document.addEventListener('click',function(){ [duitVid,gengVid,torVid,apiVid].forEach(function(v){ v.play().catch(function(){}); }); },{once:true});

// ====== UI ======
var dockBtns=document.querySelectorAll('.dockBtn');
dockBtns.forEach(function(b){
  b.addEventListener('click',function(){
    var k=b.dataset.k; effectsOn[k]=!effectsOn[k]; b.classList.toggle('on',effectsOn[k]); activeMenu=k; openSet(k);
  });
});
function openSet(k){
  var titles={sensor:'👁️ SENSOR - MUKA', api:'🔥 API - TEGAK', tornado:'🌪️ TORNADO - DATAR ATAS', hack:'💻 HACK - TOPENG', geng:'🐱 GENG - KUCING', glow:'💸 GLOW - DUIT'};
  document.getElementById('setTitle').textContent=titles[k]||'PENGATURAN';
  var body=document.getElementById('setBody');
  if(k==='api'){
    body.innerHTML='<button class="'+(effectsOn.api?'on fire':'')+'" onclick="toggleK(\'api\',this)">● ON API</button>'
    +'<button class="fire '+(apiColor==='fire'?'on':'')+'" onclick="setApiColor(\'fire\',this)">🔥 REAL FIRE</button>'
    +'<button class="blue '+(apiColor==='blue'?'on':'')+'" onclick="setApiColor(\'blue\',this)">💙 BLUE</button>'
    +'<button class="violet '+(apiColor==='violet'?'on':'')+'" onclick="setApiColor(\'violet\',this)">💜 VIOLET</button>'
    +'<button class="'+(apiSize==='kecil'?'on':'')+'" onclick="setApiSize(\'kecil\',this)">Kecil</button>'
    +'<button class="'+(apiSize==='sedang'?'on':'')+'" onclick="setApiSize(\'sedang\',this)">Sedang</button>'
    +'<button class="'+(apiSize==='besar'?'on':'')+'" onclick="setApiSize(\'besar\',this)">Besar</button>';
  } else if(k==='glow'){
    body.innerHTML='<button class="'+(effectsOn.glow?'on':'')+'" onclick="toggleK(\'glow\',this)">● ON GLOW</button>'
    +'<button class="'+(glowMode==='duit'?'on':'')+'" onclick="setGlow(\'duit\',this)">💸 DUIT FULL LAYAR</button>'
    +'<button class="'+(glowMode==='emas'?'on':'')+'" onclick="setGlow(\'emas\',this)">✨ EMAS AJA</button>';
  } else {
    body.innerHTML='<button class="'+(effectsOn[k]?'on':'')+'" onclick="toggleK(\''+k+'\',this)">● ON '+k.toUpperCase()+'</button>';
  }
  document.getElementById('settings').classList.add('open');
}
function closeSet(){ document.getElementById('settings').classList.remove('open'); }
function toggleK(k,el){ effectsOn[k]=!effectsOn[k]; document.querySelector('.dockBtn[data-k="'+k+'"]').classList.toggle('on',effectsOn[k]); openSet(activeMenu); }
function setApiColor(c,el){ apiColor=c; openSet('api'); }
function setApiSize(s,el){ apiSize=s; openSet('api'); }
function setGlow(m,el){ glowMode=m; openSet('glow'); }
document.getElementById('btnFull').onclick=function(){ if(document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(function(){}); };
document.getElementById('btnFoto').onclick=function(){
  var a=document.createElement('a'); a.download='tama-'+Date.now()+'.png'; a.href=cv.toDataURL('image/png'); a.click();
};
var rec=null, chunks=[];
document.getElementById('btnVideo').onclick=function(){
  var btn=this;
  if(rec){ rec.stop(); btn.classList.remove('rec'); btn.textContent='🎥 VIDEO'; return; }
  var stream=cv.captureStream(30); rec=new MediaRecorder(stream,{mimeType:'video/webm'});
  chunks=[]; rec.ondataavailable=function(e){ if(e.data.size) chunks.push(e.data); };
  rec.onstop=function(){ var blob=new Blob(chunks,{type:'video/webm'}); var u=URL.createObjectURL(blob); var a=document.createElement('a'); a.href=u; a.download='tama-'+Date.now()+'.webm'; a.click(); };
  rec.start(); btn.classList.add('rec'); btn.textContent='⏹ STOP';
};
openSet('api');
</script>
</body>
</html>
