<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}
html,body{
width:100%;
height:100%;
}
body{
background:#000;
overflow:hidden;
font-family:system-ui,-apple-system,sans-serif;
color:#fff;
height:100dvh;
}
body.fake-full #menu{
display:none !important;
}
body.fake-full #top{
display:none !important;
}
body.fake-full #hud{
display:none !important;
}
body.fake-full #hint{
display:none !important;
}
body.fake-full #waWarn{
display:none !important;
}
#wrap{
position:fixed;
inset:0;
background:#000;
}
video{
position:absolute;
inset:0;
width:100%;
height:100%;
object-fit:cover;
transform:scaleX(-1);
filter:contrast(1.08) saturate(1.15);
background:#000;
}
canvas{
position:absolute;
inset:0;
width:100%;
height:100%;
display:block;
}
#fx{
z-index:2;
}
#draw{
z-index:3;
}
#top{
position:absolute;
top:10px;
left:0;
right:0;
display:flex;
justify-content:center;
z-index:20;
pointer-events:none;
}
#logo{
background:rgba(0,0,0,.72);
backdrop-filter:blur(10px);
border:1px solid rgba(255,255,255,.25);
padding:6px 14px;
border-radius:999px;
display:flex;
gap:7px;
align-items:center;
}
#dot{
width:8px;
height:8px;
border-radius:50%;
background:#a855f7;
box-shadow:0 0 12px #a855f7;
}
#logoTxt{
font-weight:900;
letter-spacing:4px;
font-size:14px;
}
#hud{
position:absolute;
top:48px;
left:50%;
transform:translateX(-50%);
z-index:20;
background:rgba(0,0,0,.7);
padding:6px 12px;
border-radius:999px;
font-size:11px;
white-space:nowrap;
}
#hint{
position:absolute;
left:0;
right:0;
bottom:192px;
text-align:center;
z-index:20;
pointer-events:none;
padding:0 14px;
}
#hint span{
display:inline-block;
background:rgba(0,0,0,.75);
padding:7px 13px;
border-radius:999px;
font-size:12px;
line-height:1.4;
}
#menu{
position:absolute;
bottom:10px;
left:0;
right:0;
z-index:30;
padding:0 10px;
display:flex;
flex-direction:column;
gap:8px;
}
#mainMenu{
display:flex;
gap:6px;
overflow-x:auto;
scrollbar-width:none;
}
#mainMenu::-webkit-scrollbar{
display:none;
}
.mbtn{
flex:1;
min-width:68px;
border:1px solid rgba(255,255,255,.25);
background:rgba(15,15,22,.95);
color:#fff;
padding:11px 4px;
border-radius:14px;
font-size:11px;
font-weight:800;
text-align:center;
line-height:1.2;
cursor:pointer;
}
.mbtn.active{
background:#fff;
color:#000;
}
.mbtn small{
display:block;
font-size:9px;
opacity:.7;
font-weight:600;
margin-top:2px;
}
#subMenu{
background:rgba(10,10,16,.96);
border:1px solid rgba(255,255,255,.22);
border-radius:16px;
padding:10px;
display:none;
}
#subMenu.show{
display:block;
}
#subTitle{
font-size:12px;
font-weight:900;
margin-bottom:8px;
display:flex;
justify-content:space-between;
align-items:center;
gap:8px;
}
#backBtn{
background:#fff;
color:#000;
border:none;
padding:5px 11px;
border-radius:999px;
font-size:11px;
font-weight:800;
cursor:pointer;
}
.row{
display:flex;
gap:6px;
overflow-x:auto;
scrollbar-width:none;
padding-bottom:2px;
}
.row::-webkit-scrollbar{
display:none;
}
.btn{
flex-shrink:0;
border:1px solid rgba(255,255,255,.25);
background:rgba(30,30,40,.95);
color:#fff;
padding:9px 13px;
border-radius:999px;
font-size:12px;
font-weight:700;
white-space:nowrap;
cursor:pointer;
}
.btn.active{
background:#fff;
color:#000;
}
#topRow{
display:flex;
gap:6px;
}
.tbtn{
flex:1;
border:1px solid rgba(255,255,255,.25);
background:rgba(15,15,22,.95);
color:#fff;
padding:10px 4px;
border-radius:12px;
font-size:11px;
font-weight:800;
cursor:pointer;
}
#status{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
z-index:40;
background:rgba(0,0,0,.92);
padding:22px 20px;
border-radius:20px;
text-align:center;
font-size:13px;
line-height:1.6;
width:84%;
max-width:330px;
border:1px solid rgba(255,255,255,.2);
}
#startBtn{
background:#a855f7;
border:none;
color:#fff;
padding:13px 20px;
border-radius:999px;
font-size:14px;
font-weight:900;
width:100%;
margin-top:12px;
cursor:pointer;
}
#flash{
position:absolute;
inset:0;
background:#fff;
opacity:0;
pointer-events:none;
z-index:25;
}
#waWarn{
position:absolute;
top:78px;
left:50%;
transform:translateX(-50%);
z-index:21;
background:#f59e0b;
color:#000;
padding:6px 12px;
border-radius:999px;
font-size:11px;
font-weight:800;
display:none;
white-space:nowrap;
}
#exitFull{
display:none;
position:fixed;
top:12px;
right:12px;
z-index:100;
background:#fff;
color:#000;
border:none;
padding:9px 14px;
border-radius:999px;
font-size:12px;
font-weight:900;
cursor:pointer;
}
body.fake-full #exitFull{
display:block;
}

<body>
<div id="wrap">
<video id="cam" autoplay playsinline muted></video>
<canvas id="fx"></canvas>
<canvas id="draw"></canvas>
<div id="flash"></div>
<div id="top">
<div id="logo"><div id="dot"></div><div id="logoTxt">TAMA</div></div>
</div>
<div id="hud"><span id="fps">-- FPS</span><span> | </span><span id="modeTxt">Menu Utama</span><span> | </span><span id="handTxt">0 TANGAN</span></div>
<div id="waWarn">⚠️ Buka di Chrome biar FULL bisa dipencet</div>
<div id="hint"><span id="hintTxt">👇 Pilih menu di bawah</span></div>

<div id="subMenu"><div id="subTitle"><span id="subTitleTxt">MENU API</span><button id="backBtn">✕ Tutup</button></div><div id="subContent"></div></div>
<div id="topRow">
<button class="tbtn" id="fullBtn">⛶ FULL</button>
<button class="tbtn" id="photoBtn" style="background:#ffffff;color:#000000">📸 FOTO</button>

</div>
<div id="mainMenu">
<div class="mbtn" data-menu="portal">🌀<br>PORTAL<small>Telunjuk + Jempol</small></div>
<div class="mbtn" data-menu="api">🔥<br>API<small>Tengah Telapak</small></div>

</div>
</div>

<div id="status"><b style="font-size:16px">TAMA NEO CAMERA</b><br>AI VISUAL SYSTEM · FACE TRACKING READY<br><span style="font-size:10px;letter-spacing:1px;color:#8edfff">IZINKAN AKSES KAMERA UNTUK MEMULAI</span><br><button id="startBtn">📷 BUKA KAMERA</button><div id="errTxt" style="color:#fca5a5;font-size:11px;margin-top:8px"></div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script>
var video = document.getElementById('cam');
var fx = document.getElementById('fx');
var draw = document.getElementById('draw');
var fctx = fx.getContext('2d');
var dctx = draw.getContext('2d');
var W = 0;
var H = 0;
var currentMenu = 'none';
var fireMode = 'asli';
var fireSize = 1;
var glowMode = 'duit';
var drawColor = '#a855f7';
var drawSize = 7;
var sensorOn = true;
var handsData = [];
var face = null;
var lastFace = null;
var faceVel = {x:0, y:0};
var particles = [];
var fireParticles = [];
var moneyParticles = [];
var lastDraw = {left:null, right:null};
var smoothDraw = {left:null, right:null};
var smoothPos = {left:null, right:null};
var smoothPalm = {left:null, right:null};
var smoothFace = null;
var history = [];
var fpsFrames = 0;
var fpsTime = Date.now();
var frameCount = 0;
var lastHandTime = 0;
var portalIdx = 0;
var lastPortalChange = Date.now();
var portalEffects = ['NEON','HOLOGRAM','EMAS','AURORA','X-RAY','GALAXY'];
var loopStarted = false;
var smoothPortal = {tl:null, tr:null, bl:null, br:null};
var isFakeFull = false;
var noiseCanvas = document.createElement('canvas');
noiseCanvas.width = 260;
noiseCanvas.height = 260;
var noiseCtx = noiseCanvas.getContext('2d');
function mx(nx){ return (1-nx)*W; }
function my(ny){ return ny*H; }
function lerp(a,b,t){ return a+(b-a)*t; }
function smoothPt(key,x,y){
if(!smoothPortal[key]){ smoothPortal[key]={x:x,y:y}; return {x:x,y:y}; }
smoothPortal[key].x = lerp(smoothPortal[key].x,x,0.5);
smoothPortal[key].y = lerp(smoothPortal[key].y,y,0.5);
return {x:smoothPortal[key].x, y:smoothPortal[key].y};
}
function smoothHand(k,x,y){
if(!smoothPos[k]){ smoothPos[k]={x:x,y:y}; return {x:x,y:y}; }
smoothPos[k].x = lerp(smoothPos[k].x,x,0.6);
smoothPos[k].y = lerp(smoothPos[k].y,y,0.6);
return {x:smoothPos[k].x, y:smoothPos[k].y};
}
function smoothPalmPt(k,x,y){
if(!smoothPalm[k]){ smoothPalm[k]={x:x,y:y}; return {x:x,y:y}; }
smoothPalm[k].x = lerp(smoothPalm[k].x,x,0.45);
smoothPalm[k].y = lerp(smoothPalm[k].y,y,0.45);
return {x:smoothPalm[k].x, y:smoothPalm[k].y};
}
function isIndexUp(lm){ return lm[8].y < lm[6].y - 0.01; }
function isPortalPose(lm){
var thumbUp = Math.hypot(lm[4].x-lm[0].x, lm[4].y-lm[0].y) > 0.12;
var indexUp = Math.hypot(lm[8].x-lm[0].x, lm[8].y-lm[0].y) > 0.16;
var midDown = lm[12].y > lm[9].y;
return thumbUp && indexUp && midDown;
}
function getPalmCenter(lm){
var pts = [lm[0],lm[5],lm[9],lm[13],lm[17]];
var sx=0, sy=0;
for(var i=0;i<pts.length;i++){ sx+=pts[i].x; sy+=pts[i].y; }
return {x:sx/pts.length, y:sy/pts.length};
}

function drawRealFire(x,y,scale){
var t = Date.now()*0.004;
fctx.save();
fctx.globalCompositeOperation = 'lighter';
for(var a=0;a<3;a++){
var ax = x+Math.sin(t+a)*14;
var ay = y-70*scale-a*22;
fctx.globalAlpha = 0.10;
fctx.fillStyle = '#9ca3af';
fctx.beginPath();
fctx.arc(ax,ay,15+a*6,0,Math.PI*2);
fctx.fill();
fctx.globalAlpha = 1;
}
for(var l=0;l<5;l++){
var lx = x+(l-2)*20*scale;
var lh = (62+Math.sin(t*2+l*1.8)*18+Math.random()*6)*scale;
var lw = (24+Math.sin(t+l)*5)*scale;
var grad = fctx.createLinearGradient(lx,y+6,lx,y-lh*1.4);
if(fireMode==='asli'){ grad.addColorStop(0,'rgba(220,38,38,0.95)'); grad.addColorStop(0.35,'rgba(249,115,22,0.9)'); grad.addColorStop(0.7,'rgba(253,224,71,0.95)'); grad.addColorStop(1,'rgba(255,255,220,0.95)'); }
else if(fireMode==='biru'){ grad.addColorStop(0,'rgba(30,64,175,0.9)'); grad.addColorStop(0.5,'rgba(34,211,238,0.9)'); grad.addColorStop(1,'rgba(255,255,255,0.95)'); }
else if(fireMode==='ungu'){ grad.addColorStop(0,'rgba(88,28,135,0.9)'); grad.addColorStop(0.5,'rgba(192,38,211,0.9)'); grad.addColorStop(1,'rgba(255,255,255,0.95)'); }
else{ grad.addColorStop(0,'rgba(21,128,61,0.9)'); grad.addColorStop(0.5,'rgba(74,222,128,0.9)'); grad.addColorStop(1,'rgba(255,255,255,0.95)'); }
fctx.fillStyle = grad;
fctx.beginPath();
var wob = Math.sin(t*3+l*2)*6;
fctx.moveTo(lx-lw,y+6);
fctx.quadraticCurveTo(lx-lw-5,y-lh*0.5,lx+wob,y-lh);
fctx.quadraticCurveTo(lx+lw+5,y-lh*0.5,lx+lw,y+6);
fctx.quadraticCurveTo(lx,y+14,lx-lw,y+6);

}
var core = fctx.createRadialGradient(x,y-14*scale,0,x,y-14*scale,48*scale);
core.addColorStop(0,'rgba(255,255,255,0.95)');
core.addColorStop(0.4,'rgba(253,224,71,0.9)');
core.addColorStop(1,'rgba(249,115,22,0)');
fctx.fillStyle = core;
fctx.beginPath();
fctx.ellipse(x,y-14*scale,48*scale,36*scale,0,0,Math.PI*2);
fctx.fill();
fctx.restore();
if(Math.random()<0.7){
fireParticles.push({x:x+(Math.random()-0.5)*34,y:y-60*scale,vy:-2-Math.random()*2,life:1,size:3+Math.random()*4});
}
fireParticles = fireParticles.filter(function(p){return p.life>0;});
for(var i=0;i<fireParticles.length;i++){
var p = fireParticles[i];
p.life -= 0.03;
p.y += p.vy;
fctx.save();
fctx.globalAlpha = Math.max(0,p.life);
fctx.fillStyle = '#f97316';
fctx.shadowColor = '#f97316';
fctx.shadowBlur = 8;
fctx.beginPath();
fctx.arc(p.x,p.y,Math.max(0.5,p.size*p.life),0,Math.PI*2);

}
}

}
}else{
var col = glowMode==='pink' ? '#ec4899' : glowMode==='cyan' ? '#22d3ee' : '#a855f7';
if(particles.length<100){
particles.push({x:x,y:y,vx:(Math.random()-0.5)*1,vy:(Math.random()-0.5)*1-0.5,life:1,decay:0.02,size:5+Math.random()*8,color:col,spark:false});
}
if(Math.random()<0.12){
particles.push({x:x+(Math.random()-0.5)*50,y:y+(Math.random()-0.5)*50,vx:0,vy:-0.4,life:1,decay:0.012,size:8+Math.random()*6,color:'#ffffff',spark:true});
}
}
}
function loop(){
fctx.clearRect(0,0,W,H);
drawSensor();
if(Date.now()-lastHandTime>600) handsData=[];
document.getElementById('handTxt').textContent = handsData.length+' TANGAN';
var portalPts = [];
for(var idx=0;idx<handsData.length;idx++){
var hand = handsData[idx];
var lm = hand.landmarks;
var key = idx===0?'left':'right';
var sm = smoothHand(key,mx(lm[8].x),my(lm[8].y));
var px = sm.x;
var py = sm.y;
var pc = getPalmCenter(lm);
var palmSm = smoothPalmPt(key,mx(pc.x),my(pc.y));
if(currentMenu==='api'){
drawRealFire(palmSm.x, palmSm.y, fireSize);
}
if(currentMenu==='glow'){
if(isIndexUp(lm)) drawGlow(px,py);
}
if(currentMenu==='draw' && isIndexUp(lm)){
if(!smoothDraw[key]) smoothDraw[key] = {x:px,y:py};
smoothDraw[key].x = lerp(smoothDraw[key].x,px,0.45);
smoothDraw[key].y = lerp(smoothDraw[key].y,py,0.45);
var sx = smoothDraw[key].x;
var sy = smoothDraw[key].y;
if(lastDraw[key]){
var midX = (lastDraw[key].x+sx)/2;
var midY = (lastDraw[key].y+sy)/2;
dctx.strokeStyle = drawColor;
dctx.lineWidth = drawSize;
dctx.lineCap = 'round';
dctx.lineJoin = 'round';
dctx.shadowColor = drawColor;
dctx.shadowBlur = 10;
dctx.beginPath();
dctx.moveTo(lastDraw[key].x,lastDraw[key].y);
dctx.quadraticCurveTo(lastDraw[key].x,lastDraw[key].y,midX,midY);
dctx.lineTo(sx,sy);
dctx.stroke();
dctx.shadowBlur = 0;
}
lastDraw[key] = {x:sx,y:sy};
}else{
lastDraw[key] = null;
smoothDraw[key] = null;
}
if(currentMenu==='portal' && isPortalPose(lm)){
portalPts.push({x:mx(lm[4].x), y:my(lm[4].y)});
portalPts.push({x:mx(lm[8].x), y:my(lm[8].y)});
}
}
if(currentMenu==='portal'){
if(portalPts.length>=4){
drawPortalQuad(portalPts);
}else if(portalPts.length===2){
var h0 = handsData[0].landmarks;
var q = [{x:mx(h0[4].x),y:my(h0[4].y)},{x:mx(h0[8].x),y:my(h0[8].y)},{x:mx(h0[12].x),y:my(h0[12].y)},{x:mx(h0[0].x),y:my(h0[0].y)}];
drawPortalQuad(q);
}
}
particles = particles.filter(function(p){return p.life>0;});
for(var pi=0;pi<particles.length;pi++){
var p = particles[pi];
p.life -= p.decay;
p.x += p.vx;
p.y += p.vy;
p.vy += 0.02;
fctx.save();
fctx.globalAlpha = Math.max(0,p.life);
fctx.fillStyle = p.color;
if(p.spark){ fctx.shadowColor = p.color; fctx.shadowBlur = 12; }
fctx.beginPath();
if(p.spark){
fctx.font = '900 '+(p.size*2)+'px system-ui';
fctx.fillText('✦', p.x, p.y);
}else{
fctx.arc(p.x,p.y,Math.max(1,p.size*p.life),0,Math.PI*2);
fctx.fill();
}
fctx.restore();
}
moneyParticles = moneyParticles.filter(function(p){return p.life>0;});
for(var mi=0;mi<moneyParticles.length;mi++){
var mp = moneyParticles[mi];
mp.life -= 0.012;
mp.x += mp.vx;
mp.y += mp.vy;
mp.rot += mp.vr;
fctx.save();
fctx.globalAlpha = Math.max(0,mp.life);
fctx.translate(mp.x,mp.y);
fctx.rotate(mp.rot*Math.PI/180);
fctx.font = '900 '+mp.size+'px system-ui';
fctx.textAlign = 'center';
fctx.textBaseline = 'middle';
fctx.shadowColor = 'rgba(250,204,21,0.9)';
fctx.shadowBlur = 10;
fctx.fillText(mp.txt,0,0);
fctx.restore();
}
fpsFrames++;
if(Date.now()-fpsTime>1000){
document.getElementById('fps').textContent = Math.round(fpsFrames*1000/(Date.now()-fpsTime))+' FPS';
fpsFrames = 0;
fpsTime = Date.now();
}
requestAnimationFrame(loop);
}
function resize(){
W = window.innerWidth;
H = window.innerHeight;
fx.width = W;
fx.height = H;
draw.width = W;
draw.height = H;
}
resize();
window.addEventListener('resize',resize);
var hands = new Hands({locateFile:function(f){return 'https://cdn.jsdelivr.net/npm/@mediapipe/hands/'+f;}});
hands.setOptions({maxNumHands:2,modelComplexity:0,minDetectionConfidence:0.55,minTrackingConfidence:0.5});
hands.onResults(function(r){
if(r.multiHandLandmarks && r.multiHandLandmarks.length){
handsData = r.multiHandLandmarks.map(function(l){return {landmarks:l};});
lastHandTime = Date.now();
}else{
if(Date.now()-lastHandTime>400) handsData=[];
}
});
var faceMesh = new FaceMesh({locateFile:function(f){return 'https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/'+f;}});
faceMesh.setOptions({maxNumFaces:1,refineLandmarks:false,minDetectionConfidence:0.55,minTrackingConfidence:0.5});
faceMesh.onResults(function(r){
if(r.multiFaceLandmarks && r.multiFaceLandmarks[0]){
var lm = r.multiFaceLandmarks[0];
var xs = lm.map(function(p){return p.x;});
var ys = lm.map(function(p){return p.y;});
var minX = Math.min.apply(null,xs);
var maxX = Math.max.apply(null,xs);
var minY = Math.min.apply(null,ys);
var maxY = Math.max.apply(null,ys);
face = {x:mx((minX+maxX)/2),y:(minY+maxY)/2*H,w:(maxX-minX)*W,h:(maxY-minY)*H};
}else{
face = null;
}
});
var isWA = navigator.userAgent.includes('WhatsApp') || navigator.userAgent.includes('FBAN') || navigator.userAgent.includes('FBAV');
if(isWA) document.getElementById('waWarn').style.display='block';
function enterFull(){
var el = document.documentElement;
var p = null;
try{
if(el.requestFullscreen) p = el.requestFullscreen();
else if(el.webkitRequestFullscreen) p = el.webkitRequestFullscreen();
else if(el.mozRequestFullScreen) p = el.mozRequestFullScreen();
else if(el.msRequestFullscreen) p = el.msRequestFullscreen();
}catch(e){}
if(p && p.catch){ p.catch(function(){ enterFakeFull(); }); }
setTimeout(function(){ if(!document.fullscreenElement && !document.webkitFullscreenElement){ enterFakeFull(); } },600);
}
function enterFakeFull(){
isFakeFull = true;
document.body.classList.add('fake-full');
document.getElementById('fullBtn').textContent = '⛶ KELUAR';
try{ window.scrollTo(0,0); }catch(e){}
setTimeout(resize,100);
}
function exitFull(){
if(document.fullscreenElement || document.webkitFullscreenElement){
try{ if(document.exitFullscreen) document.exitFullscreen(); else if(document.webkitExitFullscreen) document.webkitExitFullscreen(); }catch(e){}
}
if(isFakeFull){
isFakeFull = false;
document.body.classList.remove('fake-full');
document.getElementById('fullBtn').textContent = '⛶ FULL';
setTimeout(resize,100);
}
}
document.getElementById('fullBtn').onclick = function(){
if(document.fullscreenElement || document.webkitFullscreenElement || isFakeFull){ exitFull(); }else{ enterFull(); }
};
document.getElementById('exitFull').onclick = function(){ exitFull(); };
document.addEventListener('fullscreenchange',function(){
if(!document.fullscreenElement){
document.getElementById('fullBtn').textContent = '⛶ FULL';
if(isFakeFull){ isFakeFull=false; document.body.classList.remove('fake-full'); }
}
});
var photoBtn = document.getElementById('photoBtn');
var videoBtn = document.getElementById('videoBtn');
var recTxt = document.getElementById('recTxt');
var mr = null;
var chunks = [];
var isRec = false;
var recStart = 0;
var recTimer = null;
photoBtn.onclick = function(){
var flash = document.getElementById('flash');
flash.style.opacity = '0.7';
setTimeout(function(){ flash.style.opacity='0'; },120);
var c = document.createElement('canvas');
c.width = W; c.height = H;
var ctx = c.getContext('2d');
ctx.drawImage(video,0,0,W,H);
ctx.drawImage(draw,0,0,W,H);
ctx.drawImage(fx,0,0,W,H);
var a = document.createElement('a');
a.download = 'tama-'+Date.now()+'.png';
a.href = c.toDataURL('image/png');
a.click();
};
videoBtn.onclick = function(){
if(!isRec){
var rc = document.createElement('canvas');
rc.width = W; rc.height = H;
var rctx = rc.getContext('2d');
var dr = function(){
if(!isRec) return;
rctx.drawImage(video,0,0,W,H);
rctx.drawImage(draw,0,0,W,H);
rctx.drawImage(fx,0,0,W,H);
requestAnimationFrame(dr);
};
dr();
var stream = rc.captureStream(30);
chunks = [];
var mime = (window.MediaRecorder && MediaRecorder.isTypeSupported('video/webm;codecs=vp9')) ? 'video/webm;codecs=vp9' : (window.MediaRecorder && MediaRecorder.isTypeSupported('video/webm')) ? 'video/webm' : '';
if(!window.MediaRecorder){ alert('Perekaman video belum didukung browser ini. Coba Safari versi terbaru atau Chrome.'); isRec=false; return; }
mr = mime ? new MediaRecorder(stream,{mimeType:mime}) : new MediaRecorder(stream);
mr.ondataavailable = function(e){ if(e.data.size>0) chunks.push(e.data); };
mr.onstop = function(){
var blob = new Blob(chunks,{type:'video/webm'});
var url = URL.createObjectURL(blob);
var a = document.createElement('a');
a.href = url;
a.download = 'tama-video-'+Date.now()+'.webm';
a.click();
setTimeout(function(){ URL.revokeObjectURL(url); },5000);
};
mr.start(200);
isRec = true;
recStart = Date.now();
videoBtn.textContent = '⏹ STOP';
recTxt.style.display = 'block';
recTimer = setInterval(function(){
var s = Math.floor((Date.now()-recStart)/1000);
recTxt.textContent = '● REC 00:'+String(s%60).padStart(2,'0');
},500);
}else{
mr.stop();
isRec = false;
clearInterval(recTimer);
videoBtn.textContent = '🎥 VIDEO';
recTxt.style.display = 'none';
}
};
document.getElementById('startBtn').onclick = async function(){
document.getElementById('errTxt').textContent = 'Menghubungkan kamera...';
try{
if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ throw new Error('Akses kamera membutuhkan HTTPS dan browser yang mendukung. Buka melalui GitHub Pages di Safari/Chrome.'); }
var stream = await navigator.mediaDevices.getUserMedia({video:{width:{ideal:1280},height:{ideal:720},facingMode:'user'},audio:false});
video.srcObject = stream;
await video.play();
document.getElementById('status').style.display = 'none';
var cam = new Camera(video,{onFrame:async function(){ frameCount++; await hands.send({image:video}); if(frameCount%2===0) await faceMesh.send({image:video}); },width:1280,height:720});
cam.start();
if(!loopStarted){ loopStarted=true; loop(); }
}catch(e){
document.getElementById('errTxt').textContent = 'Gagal: '+e.message;
}
};
</script>
