<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BlckDoor - Kamera</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#000;color:#fff;font-family:system-ui,-apple-system,sans-serif;overflow:hidden;height:100dvh}
#wrap{position:fixed;inset:0;background:#000}
video#cam{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);display:none}
canvas#out{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#top{position:absolute;top:0;left:0;right:0;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;z-index:10;background:linear-gradient(to bottom,rgba(0,0,0,.7),transparent)}
#logo{font-weight:900;letter-spacing:1px;font-size:18px}
#logo span{color:#a855f7}
#back{font-size:12px;background:rgba(255,255,255,.15);padding:8px 12px;border-radius:999px;color:#fff;text-decoration:none}
#status{font-size:11px;background:rgba(255,255,255,.15);padding:6px 10px;border-radius:999px;backdrop-filter:blur(10px)}
#status.on{background:#a855f7}
#menu{position:absolute;left:0;right:0;bottom:0;z-index:10;padding:10px 10px 14px;background:linear-gradient(to top,rgba(0,0,0,.85),transparent)}
#row{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
#row::-webkit-scrollbar{display:none}
.btn{min-width:78px;height:64px;border-radius:16px;border:2px solid rgba(255,255,255,.25);background:rgba(255,255,255,.12);color:#fff;font-weight:800;font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;backdrop-filter:blur(10px);flex-shrink:0}
.btn small{font-weight:500;font-size:10px;opacity:.8}
.btn.active{border-color:#a855f7;background:#a855f7;transform:scale(1.05)}
.btn.api.active{border-color:#ff6b00;background:#ff6b00}
.btn.tornado.active{border-color:#06b6d4;background:#06b6d4}
.btn.glow.active{border-color:#facc15;background:#eab308;color:#000}
.btn.geng.active{border-color:#fff;background:#fff;color:#000}
#hint{text-align:center;font-size:11px;opacity:.7;margin-top:2px}
#shutter{width:68px;height:68px;border-radius:50%;background:#fff;border:5px solid rgba(255,255,255,.4);margin:8px auto 0;display:block}
#loading{position:fixed;inset:0;background:#000;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.spinner{width:40px;height:40px;border:3px solid #333;border-top-color:#a855f7;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="loading"><div class="spinner"></div><div>Loading BlckDoor...</div><div style="font-size:11px;opacity:.6">Izinin kamera ya bung</div></div>
<div id="wrap">
<video id="cam" playsinline muted autoplay></video>
<canvas id="out"></canvas>
<div id="top"><a id="back" href="index.html">← MENU</a><div id="logo">Blck<span>Door</span></div><div id="status">KAMERA OFF</div></div>
<div id="menu">
<div id="row">
<button class="btn api" data-mode="api">🔥<span>API</span><small>di tangan</small></button>
<button class="btn tornado" data-mode="tornado">🌪️<span>TORNADO</span><small>di tangan</small></button>
<button class="btn hack active" data-mode="hack">💜<span>HACK</span><small>topeng + kode</small></button>
<button class="btn geng" data-mode="geng">😼<span>GENG</span><small>lu + kucing</small></button>
<button class="btn glow" data-mode="duit">💸<span>GLOW DUIT</span><small>duit jatuh</small></button>
<button class="btn" data-mode="sensor">👤<span>SENSOR</span><small>tutup muka</small></button>
<button class="btn" data-mode="off">❌<span>OFF</span><small>kamera aja</small></button>
</div>
<div id="hint">API / TORNADO = buka telapak tangan ke atas • HACK = topeng nempel di muka • GENG = lu di belakang kucing</div>
<button id="shutter"></button>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script>
const BASE = "media/";
const FILES = { api: BASE+"api.mp4", tornado: BASE+"tornado.mp4", duit: BASE+"duit.mp4", geng: BASE+"geng.mp4", topeng: BASE+"topeng.jpg", sensor: BASE+"sensor.jpg" };
let mode="hack"; let handPos=null; let faceBox=null;
const video=document.getElementById('cam'); const canvas=document.getElementById('out'); const ctx=canvas.getContext('2d');
const statusEl=document.getElementById('status'); const loadingEl=document.getElementById('loading');
function makeVideo(src){ const v=document.createElement('video'); v.src=src; v.loop=true; v.muted=true; v.playsInline=true; v.autoplay=true; v.play().catch(()=>{}); return v; }
const vidApi=makeVideo(FILES.api); const vidTornado=makeVideo(FILES.tornado); const vidDuit=makeVideo(FILES.duit); const vidGeng=makeVideo(FILES.geng);
const imgTopeng=new Image(); imgTopeng.src=FILES.topeng;
const imgSensor=new Image(); imgSensor.src=FILES.sensor;
function drawChroma(videoEl,dx,dy,dw,dh){
  if(videoEl.readyState<2) return;
  const tmp=document.createElement('canvas'); tmp.width=160; tmp.height=160;
  const tctx=tmp.getContext('2d'); tctx.drawImage(videoEl,0,0,160,160);
  try{ const img=tctx.getImageData(0,0,160,160); const d=img.data;
    for(let i=0;i<d.length;i+=4){ const r=d[i],g=d[i+1],b=d[i+2]; if(g>90 && g>r*1.4 && g>b*1.3){ d[i+3]=0; } }
    tctx.putImageData(img,0,0); ctx.drawImage(tmp,dx,dy,dw,dh);
  }catch(e){ ctx.drawImage(videoEl,dx,dy,dw,dh); }
}
let drops=Array.from({length:60},()=>({x:Math.random(),y:Math.random(),speed:0.01+Math.random()*0.02}));
const faceMesh=new FaceMesh({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${f}`});
faceMesh.setOptions({maxNumFaces:1,refineLandmarks:true,minDetectionConfidence:0.5,minTrackingConfidence:0.5});
faceMesh.onResults(res=>{
  if(res.multiFaceLandmarks && res.multiFaceLandmarks.length>0){
    const lm=res.multiFaceLandmarks[0]; let minX=1,maxX=0,minY=1,maxY=0;
    lm.forEach(p=>{ minX=Math.min(minX,p.x); maxX=Math.max(maxX,p.x); minY=Math.min(minY,p.y); maxY=Math.max(maxY,p.y); });
    faceBox={x:1-maxX,y:minY,w:maxX-minX,h:maxY-minY};
  } else faceBox=null;
});
const hands=new Hands({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`});
hands.setOptions({maxNumHands:1,modelComplexity:0,minDetectionConfidence:0.5,minTrackingConfidence:0.5});
hands.onResults(res=>{
  if(res.multiHandLandmarks && res.multiHandLandmarks.length>0){
    const lm=res.multiHandLandmarks[0]; const palm=lm[9]; const wrist=lm[0]; const middleTip=lm[12];
    const isOpen=Math.hypot(middleTip.x-wrist.x,middleTip.y-wrist.y)>0.18;
    handPos={x:1-palm.x,y:palm.y,open:isOpen};
  } else handPos=null;
});
async function start(){
  try{
    const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user",width:{ideal:1280},height:{ideal:720}},audio:false});
    video.srcObject=stream; await video.play(); loadingEl.style.display="none";
    statusEl.textContent="KAMERA ON • "+mode.toUpperCase(); statusEl.classList.add('on');
    const cam=new Camera(video,{onFrame:async()=>{ await hands.send({image:video}); await faceMesh.send({image:video}); },width:640,height:480});
    cam.start(); requestAnimationFrame(render);
  }catch(e){ loadingEl.innerHTML="<div>Gagal buka kamera bung 😭</div><div style='font-size:12px;opacity:.7'>Coba buka di HTTPS / izinin kamera</div>"; }
}
function render(){
  const w=canvas.width=canvas.clientWidth; const h=canvas.height=canvas.clientHeight;
  if(video.readyState>=2){
    if(mode==="hack"){
      ctx.save(); ctx.scale(-1,1); ctx.drawImage(video,-w,0,w,h); ctx.restore();
      ctx.fillStyle="rgba(10,0,20,0.55)"; ctx.fillRect(0,0,w,h);
      ctx.font="13px monospace";
      drops.forEach(d=>{ d.y+=d.speed*0.6; if(d.y>1){ d.y=0; d.x=Math.random(); } const ch="01BlckDoor{}#$"[Math.floor(Math.random()*14)]; ctx.fillStyle="rgba(168,85,247,0.85)"; ctx.fillText(ch,d.x*w,d.y*h); });
    } else if(mode==="geng"){
      ctx.fillStyle="#000"; ctx.fillRect(0,0,w,h);
      if(video.readyState>=2){
        const smallW=w*0.32; const smallH=smallW*1.3; const cx=w/2-smallW/2; const cy=h*0.18;
        ctx.save(); ctx.beginPath(); ctx.roundRect(cx,cy,smallW,smallH,16); ctx.clip(); ctx.scale(-1,1); ctx.drawImage(video,-(cx+smallW),cy,smallW,smallH); ctx.restore();
        ctx.fillStyle="#fff"; ctx.font="bold 12px system-ui"; ctx.fillText("LU - BOS GENG",cx+8,cy+smallH-10);
      }
      drawChroma(vidGeng,w*0.02,h*0.35,w*0.96,h*0.65);
    } else {
      ctx.save(); ctx.scale(-1,1); ctx.drawImage(video,-w,0,w,h); ctx.restore();
    }
  }
  if(mode==="api" && handPos && handPos.open){ const size=w*0.42; drawChroma(vidApi,handPos.x*w-size/2,handPos.y*h-size*0.7,size,size); }
  if(mode==="tornado" && handPos && handPos.open){ const size=w*0.48; drawChroma(vidTornado,handPos.x*w-size/2,handPos.y*h-size*0.75,size,size*1.15); }
  if(mode==="duit"){ drawChroma(vidDuit,0,0,w,h); }
  if(mode==="hack" && faceBox){
    const fx=faceBox.x*w; const fy=faceBox.y*h; const fw=faceBox.w*w*1.65; const fh=faceBox.h*h*1.85;
    if(imgTopeng.complete && imgTopeng.naturalWidth>0){ ctx.drawImage(imgTopeng,fx-fw*0.32,fy-fh*0.28,fw,fh); }
  }
  if(mode==="sensor" && faceBox){
    const fx=faceBox.x*w; const fy=faceBox.y*h; const fw=faceBox.w*w*1.4; const fh=faceBox.h*h*1.4;
    if(imgSensor.complete && imgSensor.naturalWidth>0){ ctx.drawImage(imgSensor,fx-fw*0.2,fy-fh*0.2,fw,fh); }
  }
  if((mode==="api"||mode==="tornado") && !handPos){
    ctx.fillStyle="rgba(0,0,0,.6)"; ctx.fillRect(w/2-130,70,260,28); ctx.fillStyle="#fff"; ctx.font="12px system-ui"; ctx.textAlign="center"; ctx.fillText("Angkat tangan, buka telapak tangan bung ✋",w/2,88); ctx.textAlign="left";
  }
  requestAnimationFrame(render);
}
document.querySelectorAll('.btn').forEach(b=>{ b.addEventListener('click',()=>{ document.querySelectorAll('.btn').forEach(x=>x.classList.remove('active')); b.classList.add('active'); mode=b.dataset.mode; statusEl.textContent="KAMERA ON • "+mode.toUpperCase(); if(mode==="api") vidApi.play().catch(()=>{}); if(mode==="tornado") vidTornado.play().catch(()=>{}); if(mode==="duit") vidDuit.play().catch(()=>{}); if(mode==="geng") vidGeng.play().catch(()=>{}); }); });
document.getElementById('shutter').addEventListener('click',()=>{ const a=document.createElement('a'); a.download="blckdoor-"+mode+"-"+Date.now()+".png"; a.href=canvas.toDataURL("image/png"); a.click(); });
start();
</script>
</body>
</html>
